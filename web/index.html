<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#131519" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="FFOS" />
    <meta name="description" content="Family Finance OS — shared books for income, expenses and plans." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Family Finance OS</title>
    <script>
      // Apply the saved look (Settings → Appearance) before the first paint. Mirrors src/lib/theme.ts.
      try {
        var t = JSON.parse(localStorage.getItem('ffos.theme') || '{}');
        var r = document.documentElement;
        if (t.mode) r.dataset.theme = t.mode;
        if (t.accent) r.dataset.accent = t.accent;
        if (t.text) r.dataset.text = t.text;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
