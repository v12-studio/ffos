name: Deploy web to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['web/**', 'shared/**', 'package-lock.json', '.github/workflows/deploy-web.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Check API address is configured
        run: |
          if [ -z "${{ vars.VITE_API_URL }}" ]; then
            echo "::error::Repository variable VITE_API_URL is not set (Settings → Secrets and variables → Actions → Variables). Without it the app would call http://localhost:8787."
            exit 1
          fi
          echo "Building against ${{ vars.VITE_API_URL }}"
      - run: npm ci
      - run: npm run build -w web
        env:
          # Served from https://<user>.github.io/<repo>/
          VITE_BASE: /${{ github.event.repository.name }}/
          # Set in repo Settings → Secrets and variables → Actions → Variables
          VITE_API_URL: ${{ vars.VITE_API_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
